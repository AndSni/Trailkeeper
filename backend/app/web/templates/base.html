<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Trailkeeper{% endblock %}</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1e2a24; --muted: #5c6b62;
    --line: #e2e0d9; --accent: #3c5a31; --accent-ink: #ffffff;
    --danger: #b23b3b; --ok: #2e7d32; --warn: #b7791f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --card: #1d2226; --ink: #e7e9e6; --muted: #9aa79f;
      --line: #2c333a; --accent: #7fae6a; --accent-ink: #14171a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--accent); }
  header.nav {
    display: flex; align-items: center; gap: 20px;
    padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  header.nav .brand { font-weight: 700; }
  header.nav .spacer { flex: 1; }
  header.nav a { text-decoration: none; color: var(--muted); }
  header.nav a.active, header.nav a:hover { color: var(--ink); }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 20px 64px; }
  .auth { max-width: 380px; margin: 8vh auto; padding: 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; margin-bottom: 16px;
  }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input, select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 7px; background: var(--bg); color: var(--ink); font: inherit;
  }
  button, .btn {
    display: inline-block; margin-top: 16px; padding: 9px 16px; border: 0;
    border-radius: 7px; background: var(--accent); color: var(--accent-ink);
    font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
  }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill {
    display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 12px;
    background: var(--line); color: var(--ink);
  }
  .pill.ok { background: var(--ok); color: #fff; }
  .pill.warn { background: var(--warn); color: #fff; }
  .pill.danger { background: var(--danger); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .error { background: var(--danger); color: #fff; padding: 8px 12px; border-radius: 7px; margin: 12px 0; font-size: 14px; }
  .muted { color: var(--muted); }
  .linkbox { word-break: break-all; background: var(--bg); border: 1px dashed var(--line); padding: 8px 10px; border-radius: 7px; font-size: 13px; }
</style>
</head>
<body>
{% block nav %}{% endblock %}
{% block body %}{% endblock %}
</body>
</html>
