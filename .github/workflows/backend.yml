name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trailkeeper
          POSTGRES_PASSWORD: trailkeeper
          POSTGRES_DB: trailkeeper_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://trailkeeper:trailkeeper@127.0.0.1:5432/trailkeeper_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Alembic migrations apply cleanly
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://trailkeeper:trailkeeper@127.0.0.1:5432/trailkeeper_test
      - run: python -m pytest
