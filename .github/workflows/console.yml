name: console

on:
  push:
    paths: ["console/**", ".github/workflows/console.yml"]
  pull_request:
    paths: ["console/**", ".github/workflows/console.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run build
